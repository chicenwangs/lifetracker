# Life Tracker planner — production compose. Pulls a released image; never builds on the server.
# Files next to this one: .env (from .env.example), data/ (SQLite + seed + backups). See SERVICE-HANDOFF.md.
name: life-tracker

services:
  app:
    image: ghcr.io/chicenwangs/lifetracker:${APP_VERSION:?set APP_VERSION in .env, e.g. 1.0.0}
    restart: unless-stopped
    init: true                      # PID 1 forwards SIGTERM -> graceful stop, DB closed
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/app.db
      SEED_DIR: /app/data/seed
    volumes:
      - ./data:/app/data            # the only state. Back this up.
    read_only: true                 # rootfs read-only; only /app/data and /tmp writable
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Stage B (LAN test, before the tunnel): uncomment, and leave ADDRESS_HEADER unset in .env.
    # Stage C (tunnel): keep this commented. A published port lets anyone fake CF-Connecting-IP.
    # ports:
    #   - "3000:3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:?set CLOUDFLARED_VERSION in .env}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      app: { condition: service_healthy }
    security_opt:
      - no-new-privileges:true
    profiles: [tunnel]              # start with: docker compose --profile tunnel up -d
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
