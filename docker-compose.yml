services:
  app:
    build: { context: ., dockerfile: app/Dockerfile }
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"          # Stage B LAN only. REMOVE in Stage C
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

