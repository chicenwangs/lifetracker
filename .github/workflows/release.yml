# Release: push a tag vX.Y.Z -> run CI -> build + push image to GHCR -> GitHub Release with deploy files.
#   git tag v1.0.0 && git push origin v1.0.0
# Image: ghcr.io/chicenwangs/lifetracker:1.0.0 (also :1.0, :sha-<short>). Never :latest in prod compose.
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']   # stable only; pre-release tags (v1.1.0-rc1) don't publish

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lifetracker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub Release with deploy bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # flat bundle: extracts straight into /opt/life-tracker
          mkdir bundle && cp -a deploy/. bundle/ && cp docs/SERVICE-HANDOFF.md bundle/
          tar -C bundle -czf "deploy-${GITHUB_REF_NAME}.tar.gz" .
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "deploy-${GITHUB_REF_NAME}.tar.gz" docs/SERVICE-HANDOFF.md
