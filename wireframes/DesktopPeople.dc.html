<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>People (desktop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#57534E;text-decoration:none}a:hover{color:#1C1917}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #F5F5F4; font-family: Inter, system-ui, sans-serif; color: #1C1917; display: flex; flex-direction: column">
  <header style="min-height: 64px; box-sizing: border-box; padding: 12px 24px; background: #fff; border-bottom: 1px solid #D6D3D1; display: flex; align-items: center; gap: 24px; flex-wrap: wrap">
    <span style="font-size: 16px; font-weight: 700">Life Tracker</span>
    <nav aria-label="Main" style="display: flex; gap: 4px; flex-wrap: wrap">
      <a href="Desktop.dc.html" style="padding: 8px 12px; border-radius: 8px; font-size: 13px">Home</a>
      <a href="DesktopPlaces.dc.html" style="padding: 8px 12px; border-radius: 8px; font-size: 13px">Places</a>
      <a href="DesktopLists.dc.html" style="padding: 8px 12px; border-radius: 8px; font-size: 13px">Lists</a>
      <a href="DesktopPeople.dc.html" style="padding: 8px 12px; border-radius: 8px; background: #E7E5E4; color: #1C1917; font-size: 13px; font-weight: 600">People</a>
      <a href="DesktopIdeas.dc.html" style="padding: 8px 12px; border-radius: 8px; font-size: 13px">Ideas</a>
      <a href="DesktopWorkouts.dc.html" style="padding: 8px 12px; border-radius: 8px; font-size: 13px">Workouts</a>
    </nav>
  </header>

  <main style="flex: 1; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
    <section style="flex: 2 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <div style="background: #fff; border: 1px solid #D6D3D1; border-radius: 14px; padding: 20px; display: flex; align-items: center; gap: 16px">
        <div aria-hidden="true" style="width: 56px; height: 56px; border-radius: 28px; background: #0F766E; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">N</div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 24px; font-weight: 700">Neina</h1>
          <span style="font-size: 13px; color: #57534E">24 facts · 13 dates done · 14 date ideas</span>
        </div>
        <button style="height: 38px; padding: 0 14px; border-radius: 10px; border: 0; background: #1C1917; color: #fff; font: 600 13px Inter, sans-serif">+ Add fact</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <div style="background: #fff; border: 1px solid #D6D3D1; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; box-sizing: border-box">
            <div style="display: flex; justify-content: space-between; align-items: baseline">
              <h2 style="margin: 0; font-size: 15px; font-weight: 700">{{c.name}}</h2>
              <span style="font-size: 12px; color: #57534E">{{c.n}}</span>
            </div>
            <sc-for list="{{c.rows}}" as="r" hint-placeholder-count="3">
              <div style="padding: 8px 10px; border-radius: 8px; background: #F5F5F4; font-size: 13px; display: flex; justify-content: space-between; gap: 8px">
                <span>[Fact]</span>
                <sc-if value="{{c.plannable}}" hint-placeholder-val="{{false}}">
                  <a href="Desktop.dc.html" style="font-size: 12px; font-weight: 600; color: #831843">Plan it</a>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </section>

    <aside style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="background: #fff; border: 1px solid #D6D3D1; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">Dates together</h2>
        <div style="min-height: 40px; padding: 0 12px; border-radius: 8px; background: #FCE7F3; color: #831843; display: flex; align-items: center; gap: 10px; font-size: 13px">
          <span aria-label="Completed" style="width: 18px; height: 18px; border-radius: 4px; background: #831843; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5.2l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8"></path></svg></span>
          <span style="flex: 1; font-weight: 600; text-decoration: line-through">Nena in Kuching</span><span style="font-size: 12px">10 Oct</span>
        </div>
        <div style="min-height: 40px; padding: 0 12px; border-radius: 8px; background: #FCE7F3; color: #831843; display: flex; align-items: center; gap: 10px; font-size: 13px">
          <span aria-label="Completed" style="width: 18px; height: 18px; border-radius: 4px; background: #831843; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5.2l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8"></path></svg></span>
          <span style="flex: 1; font-weight: 600; text-decoration: line-through">Cuti Hari Malaysia</span><span style="font-size: 12px">16 Sep</span>
        </div>
        <span style="font-size: 12px; color: #57534E">+11 earlier</span>
      </div>
      <div style="background: #fff; border: 1px solid #D6D3D1; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">Date ideas</h2>
        <sc-for list="{{ideas}}" as="i" hint-placeholder-count="6">
          <div style="min-height: 38px; padding: 0 12px; border-radius: 8px; background: #F5F5F4; display: flex; align-items: center; justify-content: space-between; font-size: 13px">
            <span>{{i.t}}</span><a href="Desktop.dc.html" style="font-size: 12px; font-weight: 600; color: #831843">Schedule</a>
          </div>
        </sc-for>
        <a href="DesktopLists.dc.html" style="font-size: 12px; font-weight: 600">See all 14 in Lists</a>
      </div>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var mk = function (name, n, k, plannable) { var rows = []; for (var i = 0; i < k; i++) rows.push({}); return { name: name, n: n, rows: rows, plannable: plannable }; };
    return {
      cats: [mk('Likes', 11, 3, false), mk('Personal info', 4, 3, false), mk('Hates', 3, 3, false), mk('Wants', 2, 2, false), mk('Bucket list', 2, 2, true), mk('Misc', 2, 2, false)],
      ideas: ['Melaka', 'Mersing Trip', 'SBS Resort Permas', 'Karaoke with nena', 'Heritage Cultural Restaurant', 'The Backyard'].map(function (t) { return { t: t }; })
    };
  }
}
</script>
</body>
</html>
