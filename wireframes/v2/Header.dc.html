<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
html,body{scrollbar-width:none;-ms-overflow-style:none}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
</style>
</helmet>
<header style="font-family: Inter, system-ui, sans-serif; color: #00003D; display: flex; align-items: center; gap: 16px; padding: 14px 32px; box-sizing: border-box; width: 100%; flex-wrap: wrap; min-height: 72px">
<a href="Main.dc.html" aria-label="Life Tracker home" style="display: flex; color: #00003D">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path><rect x="7" y="12.5" width="7" height="4" rx="1" fill="currentColor"></rect></svg>
</a>
<nav aria-label="Main" style="display: flex; gap: 4px; align-items: center; flex-wrap: wrap">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" aria-current="{{n.cur}}" style="padding: 8px 15px; border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; color: #00003D; border: 1.5px solid {{n.edge}}; background: {{n.bg}}">{{n.label}}</a>
</sc-for>
<span aria-hidden="true" style="width: 1.5px; height: 22px; background: #8E8BB5; margin: 0 8px"></span>
<sc-for list="{{pins}}" as="p" hint-placeholder-count="3">
<a href="{{p.href}}" title="Pinned page: {{p.label}} (right-click to unpin)" style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: #3D3D6B">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path></svg>{{p.label}}</a>
</sc-for>
</nav>
<div style="flex: 1"></div>
<button type="button" aria-label="Search everything (Ctrl+K)" style="font: 500 14px Inter, system-ui, sans-serif; color: #3D3D6B; background: #FFFFFF; border: 1.5px solid #6B6B8F; border-radius: 10px; padding: 9px 12px; display: flex; align-items: center; gap: 10px; min-width: 220px; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="flex: 1; text-align: left">Search</span>
<kbd style="font: 600 11px Inter, sans-serif; border: 1px solid #6B6B8F; border-radius: 4px; padding: 1px 5px; color: #3D3D6B">Ctrl K</kbd>
</button>
<button type="button" title="Quick add (N)" style="font: 600 14px Inter, system-ui, sans-serif; color: #FFFFFF; background: #00003D; border: 1.5px solid #00003D; border-radius: 10px; padding: 9px 14px; display: flex; align-items: center; gap: 8px; box-shadow: -2px 2px 0 #F3D053; cursor: pointer">+ Add <kbd style="font: 600 11px Inter, sans-serif; border: 1px solid #CED3EE; border-radius: 4px; padding: 1px 5px; color: #FFFFFF">N</kbd></button>
<button type="button" aria-label="Keyboard shortcuts (?)" title="Keyboard shortcuts (?)" style="width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid #00003D; background: #FFFFFF; color: #00003D; font: 700 16px Inter, sans-serif; cursor: pointer">?</button>
<button type="button" aria-label="Theme: Auto, light until 17:00. Change theme" title="Theme: Auto — light until 17:00" style="width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid #00003D; background: #FFFFFF; color: #00003D; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"></path></svg>
</button>
<a href="SettingsMore.dc.html" aria-label="Account menu" aria-haspopup="menu" style="width: 40px; height: 40px; border-radius: 999px; background: #00003D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; text-decoration: none; outline: {{avatarRing}}; outline-offset: 2px">J</a>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","week","keep","pages","settings","none"],"default":"home"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const items = [
      { id: 'home', label: 'Home', href: 'Main.dc.html' },
      { id: 'week', label: 'Week', href: 'Week.dc.html' },
      { id: 'keep', label: 'Keep', href: 'Keep.dc.html' },
      { id: 'pages', label: 'Pages', href: 'Pages.dc.html' }
    ];
    return {
      nav: items.map((n) => ({ ...n, cur: n.id === a ? 'page' : 'false', bg: n.id === a ? '#FFFFFF' : 'transparent', edge: n.id === a ? '#00003D' : 'transparent' })),
      avatarRing: a === 'settings' ? '2px solid #00003D' : 'none',
      pins: [
        { label: 'Workouts', href: 'Database.dc.html' },
        { label: 'Ops runbook', href: 'Pages.dc.html' },
        { label: 'Homelab', href: 'Pages.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
