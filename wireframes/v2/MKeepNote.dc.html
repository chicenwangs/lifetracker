<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checklist note</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{scrollbar-width:none;-ms-overflow-style:none}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
body{margin:0}
.tb{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#00003D;display:flex;align-items:center;justify-content:center;cursor:pointer}
.chip{display:inline-flex;align-items:center;min-height:32px;font-size:13px;font-weight:500;padding:0 12px;border-radius:999px;border:1px solid #6B6B8F;color:#3D3D6B;background:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #00003D; background: #FAEDB8">
<header style="display: flex; align-items: center; gap: 2px; padding: 8px 6px">
<a href="MKeep.dc.html" aria-label="Back to notes" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #00003D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="flex: 1; font-size: 12px; color: #3D3D6B">Saved</span>
<button class="tb" type="button" aria-label="Unpin" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 17v5M9 10.8V4h6v6.8l3 3.2H6z"></path></svg></button>
<button class="tb" type="button" aria-label="Reminder"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"></path></svg></button>
<button class="tb" type="button" aria-label="Archive"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h18v4H3zM5 9v11h14V9M10 13h4"></path></svg></button>
</header>
<div style="padding: 4px 20px 0">
<h1 style="margin: 0 0 10px; font-size: 24px">Groceries</h1>
<ul aria-label="Checklist" style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{items}}" as="i" hint-placeholder-count="5">
<li style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding-left: {{i.indent}}px; border-bottom: 1px solid rgba(0,0,61,0.12)">
<input type="checkbox" aria-label="{{i.text}}" checked="{{i.done}}" style="width: 22px; height: 22px; accent-color: #00003D; margin: 0">
<span style="flex: 1; font-size: 16px; text-decoration: {{i.deco}}; color: {{i.fg}}">{{i.text}}</span>
<span aria-hidden="true" style="color: #6B6B8F; padding: 0 6px">⋮⋮</span>
</li>
</sc-for>
<li style="display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 16px; color: #3D3D6B">+ Add item</li>
</ul>
<details style="margin-top: 8px">
<summary style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; cursor: pointer">2 done</summary>
<div style="font-size: 15px; color: #3D3D6B; padding: 4px 0 0 34px; text-decoration: line-through">Rice · Cooking oil</div>
</details>
<div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px">
<span class="chip">Binder: Home</span><span class="chip">groceries</span>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1.5px solid #00003D; background: #FFFFFF; display: flex; align-items: center; padding: 6px 8px 24px">
<button class="tb" type="button" aria-label="Add photo or file"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12l-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"></path></svg></button>
<button class="tb" type="button" aria-label="Colour"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="8" r="1"></circle></svg></button>
<button class="tb" type="button" aria-label="Labels and binders"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path></svg></button>
<div style="flex: 1; text-align: center; font-size: 12px; color: #3D3D6B">Edited 12:58</div>
<button class="tb" type="button" aria-label="More: duplicate, send to planner, move to trash"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const it = (text, d) => ({ text, indent: d * 28, done: false, deco: 'none', fg: '#00003D' });
    return { items: [it('Eggs', 0), it('Milo', 0), it('Bread', 0), it('Wholemeal', 1), it('Dish soap', 0)] };
  }
}
</script>
</body>
</html>
