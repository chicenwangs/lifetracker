<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{scrollbar-width:none;-ms-overflow-style:none}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
body{margin:0}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #E3E4F0;font-size:15px}
.row span.k{width:70px;font-size:13px;color:#3D3D6B}
.step{width:44px;height:44px;border:1.5px solid #00003D;border-radius:10px;background:#FFFFFF;color:#00003D;font:700 13px Inter,sans-serif;cursor:pointer}
.tm{font:600 18px Inter,sans-serif;color:#00003D;border:1.5px solid #6B6B8F;border-radius:10px;padding:9px 0;width:88px;text-align:center;background:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #00003D; background: #F3F2FA">
<div aria-hidden="true" style="padding: 20px 16px; filter: blur(2px)">
<div style="font-size: 28px; font-weight: 700">Today</div>
<div style="height: 120px; margin-top: 16px; border-radius: 16px; background: #B84A44"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,61,0.35)"></div>

<div role="dialog" aria-label="Gym" style="position: absolute; left: 0; right: 0; bottom: 0; top: 150px; background: #FFFFFF; border: 1.5px solid #00003D; border-bottom: 0; border-radius: 20px 20px 0 0; padding: 10px 18px 24px; box-sizing: border-box; display: flex; flex-direction: column">
<div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 999px; background: #CED3EE; margin: 0 auto 14px"></div>
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" aria-label="Not started. Tap to start" style="width: 28px; height: 28px; border-radius: 6px; border: 2px solid #00003D; background: transparent; cursor: pointer"></button>
<h1 contenteditable="true" style="margin: 0; font-size: 22px; flex: 1; outline: none">Gym</h1>
<span style="font-size: 12px; font-weight: 600; background: #FAEDB8; border: 1px solid #00003D; border-radius: 999px; padding: 3px 10px">Hobby</span>
</div>

<div style="margin-top: 18px">
<div style="font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #3D3D6B; margin-bottom: 8px">START</div>
<div style="display: flex; align-items: center; gap: 8px">
<button class="step" type="button" aria-label="Start 15 minutes earlier">−15</button>
<input class="tm" type="time" value="17:30" aria-label="Start time">
<button class="step" type="button" aria-label="Start 15 minutes later">+15</button>
<span style="font-size: 12px; color: #3D3D6B; margin-left: 4px">moves block</span>
</div>
<div style="font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #3D3D6B; margin: 14px 0 8px">END</div>
<div style="display: flex; align-items: center; gap: 8px">
<button class="step" type="button" aria-label="End 15 minutes earlier">−15</button>
<input class="tm" type="time" value="19:00" aria-label="End time">
<button class="step" type="button" aria-label="End 15 minutes later">+15</button>
<span style="font-size: 12px; color: #3D3D6B; margin-left: 4px">1 h 30 min</span>
</div>
</div>

<div style="margin-top: 14px">
<div class="row"><span class="k">Day</span><span style="flex: 1">Thu 12 Nov</span><span aria-hidden="true">›</span></div>
<div class="row"><span class="k">Remind</span><span style="flex: 1; color: #3D3D6B">None · add /remind 2h</span><span aria-hidden="true">›</span></div>
<div class="row"><span class="k">Notes</span><span style="flex: 1; color: #3D3D6B">Leg day</span><span aria-hidden="true">›</span></div>
</div>

<div style="flex: 1"></div>
<div style="display: flex; gap: 10px">
<button type="button" style="flex: 1; font: 600 14px Inter, sans-serif; color: #A83A35; background: #FFFFFF; border: 1.5px solid #A83A35; border-radius: 12px; padding: 12px; cursor: pointer">Delete</button>
<button type="button" style="flex: 1; font: 600 14px Inter, sans-serif; color: #00003D; background: #FFFFFF; border: 1.5px solid #00003D; border-radius: 12px; padding: 12px; cursor: pointer">Duplicate</button>
<button type="button" style="flex: 1.3; font: 700 14px Inter, sans-serif; color: #FFFFFF; background: #00003D; border: 0; border-radius: 12px; padding: 12px; box-shadow: -3px 3px 0 #F3D053; cursor: pointer">Done</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
