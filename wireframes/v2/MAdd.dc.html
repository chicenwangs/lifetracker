<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{scrollbar-width:none;-ms-overflow-style:none}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
body{margin:0}
.slot{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:600}
.slot>span{font-size:10.5px;font-weight:700;color:#3D3D6B;letter-spacing:.04em}
.seg button{font:600 13px Inter,sans-serif;flex:1;min-height:40px;border:0;background:#FFFFFF;color:#00003D;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #00003D; background: #F3F2FA">
<div aria-hidden="true" style="padding: 20px 16px; filter: blur(2px)">
<div style="font-size: 13px; color: #3D3D6B">Thursday 12 Nov</div>
<div style="font-size: 28px; font-weight: 700">Today</div>
<div style="height: 120px; margin-top: 16px; border-radius: 16px; background: #CED3EE"></div>
<div style="height: 150px; margin-top: 16px; border-radius: 14px; background: #FFFFFF"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,61,0.35)"></div>

<div role="dialog" aria-label="Add" style="position: absolute; left: 0; right: 0; bottom: 291px; background: #FFFFFF; border: 1.5px solid #00003D; border-bottom: 0; border-radius: 20px 20px 0 0; padding: 8px 16px 14px; box-sizing: border-box">
<div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 999px; background: #8E8BB5; margin: 0 auto 10px"></div>
<div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px">
<div role="tablist" aria-label="What to add" style="display: flex; background: #F3F2FA; border-radius: 10px; padding: 3px; flex: 1">
<button type="button" role="tab" aria-selected="true" style="flex: 1; min-height: 36px; font: 700 13px Inter, sans-serif; color: #00003D; background: #FFFFFF; border: 1.5px solid #00003D; border-radius: 8px; cursor: pointer">Plan it</button>
<a href="MKeepNew.dc.html" role="tab" aria-selected="false" style="flex: 1; min-height: 36px; display: flex; align-items: center; justify-content: center; font: 600 13px Inter, sans-serif; color: #00003D; text-decoration: none">Quick note</a>
</div>
<button type="button" aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; color: #00003D; font-size: 18px; cursor: pointer">✕</button>
</div>
<label style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)" for="qa">What and when</label>
<div style="border: 1.5px solid #00003D; border-radius: 12px; padding: 11px 12px; font-size: 16px; display: flex; align-items: center">
<span id="qa">send ops report 4pm</span><span aria-hidden="true" style="display: inline-block; width: 1.5px; height: 20px; background: #00003D; margin: 0 2px"></span><span style="color: #6B6B8F">for 30m /type</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0">
<div class="slot"><span>WHEN</span>Today 16:00–17:00</div>
<div class="slot"><span>TYPE</span><span style="font-size: 12px; font-weight: 600; color: #00003D; border: 1.5px dashed #6B6B8F; border-radius: 6px; padding: 1px 6px; align-self: flex-start">None</span></div>
<div class="slot"><span>CLASH</span><span style="font-size: 12px; font-weight: 600; color: #00003D; background: #FAEDB8; border-radius: 999px; padding: 1px 8px; align-self: flex-start">Change review</span></div>
</div>
<div class="seg" role="radiogroup" aria-label="Goes to" style="display: flex; border: 1.5px solid #00003D; border-radius: 10px; overflow: hidden; margin-bottom: 12px">
<button type="button" role="radio" aria-checked="true" style="background: #00003D; color: #FFFFFF">Timeline</button>
<button type="button" role="radio" aria-checked="false" style="border-left: 1.5px solid #00003D">Calendar</button>
<button type="button" role="radio" aria-checked="false" style="border-left: 1.5px solid #00003D">Both</button>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button type="button" style="font: 600 13px Inter, sans-serif; border: 1.5px solid #00003D; border-radius: 999px; min-height: 36px; padding: 0 12px; white-space: nowrap; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
</sc-for>
</div>
<button type="button" style="width: 100%; min-height: 48px; font: 700 15px Inter, sans-serif; color: #FFFFFF; background: #00003D; border: 0; border-radius: 12px; box-shadow: -3px 3px 0 #F3D053; cursor: pointer">Add to today</button>
</div>

<div role="img" aria-label="Phone keyboard" style="position: absolute; left: 0; right: 0; bottom: 0; height: 291px; background: #D9D8E4; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #3D3D6B">[ system keyboard ]</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      chips: [
        { label: 'Work', bg: '#CED3EE', fg: '#00003D' },
        { label: 'Deadline', bg: '#B84A44', fg: '#FFFFFF' },
        { label: 'Event', bg: '#D3EECE', fg: '#00003D' },
        { label: 'Hobby', bg: '#FAEDB8', fg: '#00003D' },
        { label: 'Date', bg: '#EECFD4', fg: '#00003D' },
        { label: 'Errand', bg: '#CFE8E6', fg: '#00003D' },
        { label: 'Health', bg: '#F7D9C4', fg: '#00003D' },
        { label: '+ Type', bg: '#FFFFFF', fg: '#00003D' },
        { label: 'Remind…', bg: '#FFFFFF', fg: '#00003D' }
      ]
    };
  }
}
</script>
</body>
</html>
