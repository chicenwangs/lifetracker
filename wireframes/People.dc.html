<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>People</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#57534E;text-decoration:none}a:hover{color:#1C1917}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F5F4; font-family: Inter, system-ui, sans-serif; color: #1C1917; overflow: hidden">
  <header style="padding: 16px 20px 8px; display: flex; flex-direction: column; gap: 8px">
    <a href="More.dc.html" style="display: flex; align-items: center; gap: 4px; font-size: 15px; padding: 8px 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>More</a>
    <div style="display: flex; align-items: center; gap: 12px">
      <div aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; background: #0F766E; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">N</div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700">Neina</h1>
        <span style="font-size: 12px; color: #57534E">24 facts · 13 dates done · 14 ideas</span>
      </div>
    </div>
  </header>

  <div role="tablist" aria-label="Categories" style="padding: 8px 20px 12px; display: flex; gap: 6px; flex-wrap: wrap">
    <button role="tab" aria-selected="true" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #1C1917; background: #1C1917; color: #fff; font: 600 12px Inter, sans-serif">Likes 11</button>
    <button role="tab" aria-selected="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #D6D3D1; background: #fff; color: #1C1917; font: 500 12px Inter, sans-serif">Info 4</button>
    <button role="tab" aria-selected="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #D6D3D1; background: #fff; color: #1C1917; font: 500 12px Inter, sans-serif">Hates 3</button>
    <button role="tab" aria-selected="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #D6D3D1; background: #fff; color: #1C1917; font: 500 12px Inter, sans-serif">Wants 2</button>
    <button role="tab" aria-selected="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #D6D3D1; background: #fff; color: #1C1917; font: 500 12px Inter, sans-serif">Bucket list 2</button>
    <button role="tab" aria-selected="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #D6D3D1; background: #fff; color: #1C1917; font: 500 12px Inter, sans-serif">Misc 2</button>
  </div>

  <section style="padding: 0 20px; display: flex; flex-direction: column; gap: 8px">
    <div style="background: #fff; border: 1px solid #D6D3D1; border-radius: 12px; overflow: hidden">
      <sc-for list="{{likes}}" as="f" hint-placeholder-count="4">
        <div style="min-height: 44px; padding: 10px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid #E7E5E4">
          <span style="font-size: 14px; font-weight: 500">[Fact]</span>
          <span style="font-size: 12px; color: #57534E">[Detail]</span>
        </div>
      </sc-for>
      <button style="width: 100%; height: 44px; border: 0; background: #fff; font: 500 13px Inter, sans-serif; color: #57534E">+ Add a like</button>
    </div>
  </section>

  <section style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 15px; font-weight: 700">Bucket list</h2>
    <div style="background: #fff; border: 1px solid #D6D3D1; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <span style="font-size: 14px">[Bucket list item]</span>
      <a href="Calendar.dc.html" style="height: 32px; padding: 0 12px; border-radius: 16px; background: #1C1917; color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; white-space: nowrap">Plan it</a>
    </div>
  </section>

  <section style="padding: 16px 20px; display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 15px; font-weight: 700">Dates together</h2>
    <div style="background: #fff; border: 1px solid #D6D3D1; border-radius: 12px; overflow: hidden">
      <div style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E7E5E4; font-size: 14px"><span>Nena in Kuching</span><span style="font-size: 12px; color: #57534E">10 Oct · done</span></div>
      <div style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E7E5E4; font-size: 14px"><span>Cuti Hari Malaysia</span><span style="font-size: 12px; color: #57534E">16 Sep · done</span></div>
      <a href="Lists.dc.html" style="min-height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #1C1917"><span>Date ideas</span><span style="font-size: 12px; color: #57534E">Melaka, Mersing trip, karaoke… ›</span></a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { likes: [{}, {}, {}, {}] }; }
}
</script>
</body>
</html>
