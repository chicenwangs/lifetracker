<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lists</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#57534E;text-decoration:none}a:hover{color:#1C1917}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F5F4; font-family: Inter, system-ui, sans-serif; color: #1C1917; overflow: hidden">
  <header style="padding: 16px 20px 8px; display: flex; flex-direction: column; gap: 8px">
    <a href="More.dc.html" style="display: flex; align-items: center; gap: 4px; font-size: 15px; padding: 8px 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>More</a>
    <h1 style="margin: 0; font-size: 24px; font-weight: 700">Lists</h1>
  </header>

  <div role="tablist" aria-label="Lists" style="padding: 4px 20px 12px; display: flex; gap: 6px; overflow-x: auto; white-space: nowrap">
    <button role="tab" aria-selected="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #1C1917; background: #1C1917; color: #fff; font: 600 13px Inter, sans-serif">Watchlist 6</button>
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D6D3D1; background: #fff; color: #1C1917; font: 500 13px Inter, sans-serif">Date ideas 14</button>
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D6D3D1; background: #fff; color: #1C1917; font: 500 13px Inter, sans-serif">Games 33</button>
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D6D3D1; background: #fff; color: #1C1917; font: 500 13px Inter, sans-serif">Soundtrack 26</button>
    <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D6D3D1; background: #fff; color: #1C1917; font: 500 13px Inter, sans-serif">cw2 rules 2</button>
    <button aria-label="New list" style="width: 36px; height: 36px; border-radius: 18px; border: 1px dashed #A8A29E; background: transparent; color: #1C1917; font: 600 16px Inter, sans-serif; padding: 0">+</button>
  </div>

  <div style="padding: 0 20px 12px; display: flex; gap: 8px">
    <label for="add" style="position: absolute; left: -9999px">Add to watchlist</label>
    <input id="add" placeholder="Add a movie…" style="flex: 1; height: 44px; box-sizing: border-box; border: 1px solid #D6D3D1; border-radius: 12px; padding: 0 14px; font: 14px Inter, sans-serif; background: #fff">
    <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #1C1917; color: #fff; font: 600 14px Inter, sans-serif">Add</button>
  </div>

  <section style="flex: 1; padding: 0 20px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <div style="background: #fff; border: 1px solid #D6D3D1; border-radius: 12px; overflow: hidden">
      <sc-for list="{{todo}}" as="m" hint-placeholder-count="5">
        <div style="min-height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #E7E5E4">
          <input type="checkbox" aria-label="Watched" style="width: 18px; height: 18px; margin: 0">
          <span style="flex: 1; font-size: 14px">{{m.t}}</span>
          <button aria-label="Plan as a date" style="height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid #D6D3D1; background: #fff; font: 500 11px Inter, sans-serif; color: #1C1917">Plan</button>
        </div>
      </sc-for>
    </div>
    <span style="font-size: 11px; color: #57534E">Swipe left to delete · Plan turns it into a dated event</span>
    <button style="height: 40px; border: 0; background: transparent; text-align: left; padding: 0; font: 600 13px Inter, sans-serif; color: #57534E">▸ Watched (1) · Django Unchained</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      todo: ['The Odyssey', 'Lord of War', 'Secret Life of Walter Mitty', 'War Dogs', 'Spiderman Brand New Day'].map(function (t) { return { t: t }; })
    };
  }
}
</script>
</body>
</html>
