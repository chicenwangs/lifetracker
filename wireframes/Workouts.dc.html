<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workouts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#57534E;text-decoration:none}a:hover{color:#1C1917}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F5F4; font-family: Inter, system-ui, sans-serif; color: #1C1917; overflow: hidden">
  <header style="padding: 16px 20px 8px; display: flex; flex-direction: column; gap: 8px">
    <a href="More.dc.html" style="display: flex; align-items: center; gap: 4px; font-size: 15px; padding: 8px 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>More</a>
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #57534E">Friday split</span>
        <h1 style="margin: 0; font-size: 24px; font-weight: 700">Chest + Back</h1>
      </div>
      <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #D6D3D1; background: #fff; font: 500 12px Inter, sans-serif; color: #1C1917">Edit split</button>
    </div>
  </header>

  <section style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <article style="background: #fff; border: 1px solid #D6D3D1; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 15px; font-weight: 600">Chest</span>
        <span style="font-size: 12px; color: #57534E">Last: 27.2 kg · light</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <button aria-label="Decrease weight" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D6D3D1; background: #fff; font: 600 18px Inter, sans-serif; color: #1C1917">−</button>
        <label style="flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 4px"><input aria-label="Weight in kg" value="27.2" style="width: 72px; border: 0; text-align: right; font: 700 24px Inter, sans-serif; color: #1C1917; background: transparent"><span style="font-size: 13px; color: #57534E">kg</span></label>
        <button aria-label="Increase weight" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D6D3D1; background: #fff; font: 600 18px Inter, sans-serif; color: #1C1917">+</button>
      </div>
      <div role="group" aria-label="Effort" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #D6D3D1; border-radius: 10px; overflow: hidden">
        <button style="height: 36px; border: 0; background: #fff; font: 500 12px Inter, sans-serif; color: #1C1917">Light</button>
        <button style="height: 36px; border: 0; background: #1C1917; font: 600 12px Inter, sans-serif; color: #fff">Moderate</button>
        <button style="height: 36px; border: 0; background: #fff; font: 500 12px Inter, sans-serif; color: #1C1917">Heavy</button>
      </div>
      <button style="height: 44px; border-radius: 10px; border: 0; background: #1C1917; color: #fff; font: 600 14px Inter, sans-serif">Log set</button>
    </article>

    <article style="background: #fff; border: 1px solid #D6D3D1; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 15px; font-weight: 600">Back</span>
        <span style="font-size: 12px; color: #57534E">No previous session</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <button aria-label="Decrease weight" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D6D3D1; background: #fff; font: 600 18px Inter, sans-serif; color: #1C1917">−</button>
        <label style="flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 4px"><input aria-label="Weight in kg" placeholder="—" style="width: 72px; border: 0; text-align: right; font: 700 24px Inter, sans-serif; color: #1C1917; background: transparent"><span style="font-size: 13px; color: #57534E">kg</span></label>
        <button aria-label="Increase weight" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #D6D3D1; background: #fff; font: 600 18px Inter, sans-serif; color: #1C1917">+</button>
      </div>
    </article>
  </section>

  <section style="padding: 16px 20px; display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 15px; font-weight: 700">Progress, last 4 weeks</h2>
    <div style="background: #fff; border: 1px solid #D6D3D1; border-radius: 12px; overflow: hidden">
      <div style="display: grid; grid-template-columns: 90px repeat(4, minmax(0, 1fr)); padding: 8px 14px; font-size: 11px; font-weight: 600; color: #57534E; border-bottom: 1px solid #E7E5E4">
        <span>kg</span><span>W1</span><span>W2</span><span>W3</span><span>W4</span>
      </div>
      <div style="display: grid; grid-template-columns: 90px repeat(4, minmax(0, 1fr)); padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #E7E5E4">
        <span style="font-weight: 600">Triceps</span><span>7.5</span><span>7.5</span><span>8.5</span><span>8.5</span>
      </div>
      <div style="display: grid; grid-template-columns: 90px repeat(4, minmax(0, 1fr)); padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #E7E5E4">
        <span style="font-weight: 600">Biceps</span><span>11</span><span style="color: #A8A29E">—</span><span style="color: #A8A29E">—</span><span style="color: #A8A29E">—</span>
      </div>
      <div style="display: grid; grid-template-columns: 90px repeat(4, minmax(0, 1fr)); padding: 10px 14px; font-size: 13px">
        <span style="font-weight: 600">Chest</span><span>27.2</span><span style="color: #A8A29E">—</span><span style="color: #A8A29E">—</span><span style="color: #A8A29E">—</span>
      </div>
    </div>
    <span style="font-size: 11px; color: #57534E">Built from logged sets; no columns to fill by hand</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
