<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline · Life Tracker</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #1a1446;
				color: #fff;
				font:
					16px/1.5 system-ui,
					sans-serif;
				text-align: center;
				padding: 16px;
			}
			button {
				margin-top: 12px;
				min-height: 44px;
				padding: 0 20px;
				border-radius: 10px;
				border: 0;
				font: inherit;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>You're offline</h1>
			<p>
				Life Tracker needs the server to show your plans. Nothing is lost; open it again when you're back
				online.
			</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
